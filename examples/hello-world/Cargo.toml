[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"

[features]
default = ["wayland"]
wayland = ["libcosmic/wayland"]

[dependencies]
env_logger = "0.11"

[dependencies.libcosmic]
path = "../../"
features = [
    "debug",
    "winit",
    "tokio",
    "xdg-portal",
    "a11y",
    "multi-window",
    "wgpu",
    "wayland",
]